[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
hex = "0.4"
pixels = "0.13"
bytemuck = { version = "1", features = ["derive"] }
winit = { version = "0.28", features = ["serde"] }
