[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
hex = "0.4"
pixels = "0.13"
pollster = "0.3"
png = "0.18"
bytemuck = { version = "1", features = ["derive"] }
winit = { version = "0.28", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
foreign-types = "0.3"
mach2 = "0.4"
metal = "0.24"
objc = "0.2"
wgpu-hal = { version = "0.16", features = ["metal"] }

[lints.rust]
# The objc message macros test this cfg at their invocation sites.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
